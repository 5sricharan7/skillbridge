name: Daily market scrape

# Refreshes backend/data/live_postings.csv, the file GET /market-demand reads for
# its fresh_signals layer. The prepared artifacts under backend/data/artifacts are
# never written by this workflow.
#
# Remote OK's public API needs no key, so this workflow declares no secrets. If the
# source ever starts requiring one, add it here as a repository secret and stop —
# do not hardcode a credential and do not work around a refusal.

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: :00 is when every other scheduled
    # job on the platform fires, and the source is a single shared API.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The declared backend dependency set, not a hand-picked subset. The scraper
      # imports backend.data.market_demand, which reads the artifact loaders, so it
      # needs pyarrow as well as httpx; installing httpx alone fails at import on
      # every run. Reading the one requirements file means this step cannot drift
      # away from what the code actually imports.
      - name: Install backend dependencies
        run: python -m pip install --quiet -r backend/requirements.txt

      # One request for the whole run: the source is a shared public API and the
      # script is built around a single fetch. It logs the counts it derived and
      # exits non-zero on a refusal, a challenge, or an unreachable source, so a
      # bad run shows up as a failed job and writes nothing.
      - name: Scrape live postings
        run: python -m backend.ml.scraper_daily

      # `git status --porcelain` rather than `git diff --quiet`: diff sees only
      # tracked paths, so while live_postings.csv is untracked a changed file would
      # read as "no change" and this job would quietly never commit anything.
      - name: Commit the refreshed live file
        run: |
          if [ -z "$(git status --porcelain -- backend/data/live_postings.csv)" ]; then
            echo "No change in live_postings.csv; nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backend/data/live_postings.csv
          git commit -m 'chore(data): refresh live market postings'
          git push
